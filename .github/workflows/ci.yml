name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  # Backend: type-check, unit tests, build. No database required - unit tests
  # mock Prisma, and integration tests run in their own job below.
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Type-check backend
        working-directory: ./backend
        run: npm run lint

      - name: Run backend unit tests
        working-directory: ./backend
        run: npm test -- --coverage
        env:
          JWT_SECRET: ci-unit-test-secret-not-used-for-anything-real
          NODE_ENV: test

      - name: Build backend
        working-directory: ./backend
        run: npm run build

  # Frontend: lint and production build.
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Lint frontend
        working-directory: ./client
        run: npm run lint

      - name: Run frontend tests
        working-directory: ./client
        # The client has no test files yet (see PLATFORM_AUDIT.md F-section).
        # --passWithNoTests keeps this green until they land, at which point
        # this step starts enforcing them with no workflow change needed.
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build frontend
        working-directory: ./client
        run: npm run build
        env:
          # Create React App only reads REACT_APP_*-prefixed variables.
          REACT_APP_API_URL: http://localhost:31611/api
          REACT_APP_WS_URL: ws://localhost:31612

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          # react-scripts builds to build/, not dist/.
          path: client/build
          retention-days: 7

  # Integration tests boot the real AppModule against a real database.
  integration-test:
    runs-on: ubuntu-latest
    needs: [backend-test]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eldercare_integration
          POSTGRES_USER: eldercare
          POSTGRES_PASSWORD: eldercare_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Setup database
        working-directory: ./backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://eldercare:eldercare_password@localhost:5432/eldercare_integration

      - name: Run integration tests
        working-directory: ./backend
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://eldercare:eldercare_password@localhost:5432/eldercare_integration
          JWT_SECRET: ci-integration-test-secret-not-used-for-anything-real
          NODE_ENV: test

  # Reporting only. The client currently carries 60 advisories that cannot be
  # cleared without migrating off the deprecated create-react-app toolchain
  # (SIX_MONTH_PLAN.md, Month 6). Make this blocking once that migration lands.
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Backend security audit (report only)
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Frontend security audit (report only)
        working-directory: ./client
        run: npm audit --audit-level=high || true

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: eldercare-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          tags: eldercare-frontend:latest
