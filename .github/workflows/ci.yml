name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: eldercare_test
          POSTGRES_USER: eldercare
          POSTGRES_PASSWORD: eldercare_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate
      
      - name: Run database migrations
        working-directory: ./backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://eldercare:eldercare_password@localhost:5432/eldercare_test
      
      - name: Run backend tests
        working-directory: ./backend
        run: npm test
        env:
          DATABASE_URL: postgresql://eldercare:eldercare_password@localhost:5432/eldercare_test
          JWT_SECRET: test-secret
          NODE_ENV: test
      
      - name: Run backend linter
        working-directory: ./backend
        run: npm run lint || true
      
      - name: Build backend
        working-directory: ./backend
        run: npm run build

  # Frontend Tests
  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci
      
      - name: Run frontend linter
        working-directory: ./client
        run: npm run lint || true
      
      - name: Build frontend
        working-directory: ./client
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001/api
          VITE_WS_URL: ws://localhost:3002
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: client/dist

  # Integration Tests
  integration-test:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: eldercare_integration
          POSTGRES_USER: eldercare
          POSTGRES_PASSWORD: eldercare_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Setup database
        working-directory: ./backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://eldercare:eldercare_password@localhost:5432/eldercare_integration
      
      - name: Run integration tests
        working-directory: ./backend
        run: npm run test:integration || true
        env:
          DATABASE_URL: postgresql://eldercare:eldercare_password@localhost:5432/eldercare_integration
          JWT_SECRET: test-secret
          NODE_ENV: test

  # Security Audit
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Run backend security audit
        working-directory: ./backend
        run: npm audit --audit-level=moderate || true
      
      - name: Run frontend security audit
        working-directory: ./client
        run: npm audit --audit-level=moderate || true

  # Build Docker Images (on main branch)
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          tags: eldercare-backend:latest
      
      - name: Build frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./client
          push: false
          tags: eldercare-frontend:latest
