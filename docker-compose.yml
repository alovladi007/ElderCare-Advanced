version: '3.8'

services:
  # PostgreSQL Database for NestJS Backend
  postgres:
    image: postgres:15-alpine
    container_name: eldercare-postgres
    environment:
      POSTGRES_USER: eldercare
      POSTGRES_PASSWORD: eldercare_password
      POSTGRES_DB: eldercare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eldercare"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for Monitoring & Legacy Systems
  mongodb:
    image: mongo:6-focal
    container_name: eldercare-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: eldercare
      MONGO_INITDB_ROOT_PASSWORD: eldercare_password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend (Unified API + Smart Home)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eldercare-backend
    environment:
      DATABASE_URL: postgresql://eldercare:eldercare_password@postgres:5432/eldercare_db?schema=public
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      IOT_TOKEN_SECRET: ${IOT_TOKEN_SECRET:-your-iot-gateway-secret-change-in-production}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run start"

  # Legacy Server (Bookings, Services, Auth)
  legacy-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: eldercare-legacy-server
    environment:
      MONGODB_URI: mongodb://eldercare:eldercare_password@mongodb:27017/eldercare?authSource=admin
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  # Monitoring Backend (Health Monitoring + WebSocket)
  monitoring-backend:
    build:
      context: ./monitoring-backend
      dockerfile: Dockerfile
    container_name: eldercare-monitoring
    environment:
      MONGODB_URI: mongodb://eldercare:eldercare_password@mongodb:27017/monitoring?authSource=admin
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      CLIENT_URL: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./monitoring-backend:/app
      - /app/node_modules

  # Next.js Frontend (Smart Home UI)
  frontend-next:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eldercare-frontend-next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3002:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # React Client (Main Website)
  frontend-react:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: eldercare-frontend-react
    environment:
      REACT_APP_API_URL: http://localhost:3001/api
      REACT_APP_MONITORING_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - monitoring-backend
    volumes:
      - ./client:/app
      - /app/node_modules

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: eldercare-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend-react
      - frontend-next
      - backend
      - legacy-server
      - monitoring-backend
    profiles:
      - production

volumes:
  postgres_data:
  mongodb_data:

networks:
  default:
    name: eldercare-network
