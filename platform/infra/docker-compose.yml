version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eldercare-postgres
    environment:
      POSTGRES_USER: eldercare
      POSTGRES_PASSWORD: eldercare_dev_password
      POSTGRES_DB: eldercare_db
    ports:
      - "31623:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eldercare"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eldercare-redis
    ports:
      - "31624:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: eldercare-backend
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://eldercare:eldercare_dev_password@postgres:5432/eldercare_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=development-jwt-secret-change-in-production
      - PORT=31615
    ports:
      - "31615:31615"
    volumes:
      - ../backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start:dev

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: eldercare-frontend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:31615
    ports:
      - "31618:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
